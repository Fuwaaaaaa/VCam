<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCam — VRM Face Tracking</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; font-family: system-ui, sans-serif; color: #eee; }
    #webcam-container { position: fixed; top: 12px; right: 12px; width: 240px; z-index: 10; border: 1px solid #444; background: #000; }
    #webcam { width: 100%; display: block; transform: scaleX(-1); }
    .panel { position: fixed; background: rgba(0, 0, 0, 0.65); padding: 10px 14px; border-radius: 6px; z-index: 10; font-size: 13px; line-height: 1.5; max-width: 360px; }
    #status { top: 12px; left: 12px; }
    #drop-zone { bottom: 12px; left: 12px; border: 1px dashed #666; cursor: pointer; }
    #drop-zone.dragging { border-color: #4a9; background: rgba(0, 60, 40, 0.7); }
    #help { bottom: 12px; right: 12px; font-size: 12px; opacity: 0.75; }
    #controls { top: 260px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
    #settings { top: 260px; left: 12px; min-width: 260px; }
    #settings details { margin: -10px -14px; padding: 10px 14px; }
    #settings details[open] { padding-bottom: 14px; }
    #settings summary { cursor: pointer; user-select: none; font-weight: 600; }
    #settings .row { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 12px; }
    #settings .row .head { display: flex; justify-content: space-between; align-items: center; }
    #settings input[type=range] { width: 100%; }
    #settings input[type=checkbox] { margin-right: 6px; }
    #settings button { background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; margin-top: 10px; }
    #settings button:hover { background: #3a3a3a; }
    #multiverse { bottom: 100px; right: 12px; min-width: 260px; }
    #multiverse details { margin: -10px -14px; padding: 10px 14px; }
    #multiverse details[open] { padding-bottom: 14px; }
    #multiverse summary { cursor: pointer; user-select: none; font-weight: 600; }
    #multiverse .row { display: flex; gap: 4px; margin-top: 8px; font-size: 12px; }
    #multiverse input[type=text] { flex: 1; background: #1a1a1a; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 4px 6px; font-size: 11px; font-family: ui-monospace, monospace; }
    #multiverse button { background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    #multiverse button:hover { background: #3a3a3a; }
    #multiverse #peers-list { margin-top: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; }
    #multiverse .peer-row { display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; padding: 3px 6px; border-radius: 3px; }
    #multiverse .peer-row button { padding: 0 6px; font-size: 11px; }
    #controls button { background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    #controls button:hover { background: #3a3a3a; }
    #controls button.active { background: #2a6b4a; border-color: #4a9; }
    #controls .meter { height: 6px; background: #222; border: 1px solid #555; border-radius: 3px; overflow: hidden; }
    #controls .meter > div { height: 100%; background: linear-gradient(to right, #4a9, #ac4); width: 0%; transition: width 60ms linear; }
    kbd { background: #333; padding: 1px 5px; border-radius: 3px; font-size: 11px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="status" class="panel">初期化中…</div>

  <div id="webcam-container">
    <video id="webcam" autoplay muted playsinline></video>
  </div>

  <label id="drop-zone" class="panel">
    ここに <b>.vrm</b> をドラッグ&ドロップ<br />
    <small>または <u>クリックしてファイル選択</u></small>
    <input id="vrm-input" type="file" accept=".vrm" style="display:none" />
  </label>

  <div id="controls" class="panel">
    <button id="mic-btn" type="button" title="マイクベースのリップシンクを有効化">🎙 マイク OFF</button>
    <div class="meter" title="マイク音量"><div id="mic-meter"></div></div>
    <button id="gaze-btn" type="button" class="active" title="目線追従">👀 目線 ON</button>
    <button id="smooth-btn" type="button" class="active" title="One Euro Filter スムージング">〰 スムージング ON</button>
    <button id="pose-btn" type="button" class="active" title="上半身ポーズ追従 (Phase 3-a)">👤 ポーズ ON</button>
  </div>

  <div id="settings" class="panel">
    <details>
      <summary>⚙ 設定</summary>
      <div class="row">
        <div class="head"><span>脚の強度</span><span id="legStrength-val">1.00</span></div>
        <input type="range" id="legStrength" min="0" max="1" step="0.05" value="1">
      </div>
      <div class="row">
        <div class="head"><span>ヒップ位置強度</span><span id="hipPosStrength-val">0.30</span></div>
        <input type="range" id="hipPosStrength" min="0" max="1" step="0.05" value="0.3">
      </div>
      <div class="row">
        <div class="head"><span>マイク感度</span><span id="micSensitivity-val">5.0</span></div>
        <input type="range" id="micSensitivity" min="1" max="15" step="0.5" value="5">
      </div>
      <div class="row">
        <label><input type="checkbox" id="transparentBg"> 透過背景 (Phase F)</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="bloom"> ブルーム効果</label>
      </div>
      <div class="row">
        <div class="head"><span>ブルーム強度</span><span id="bloomStrength-val">0.80</span></div>
        <input type="range" id="bloomStrength" min="0" max="3" step="0.1" value="0.8">
      </div>
      <button id="reset-settings" type="button">既定値にリセット</button>
    </details>
  </div>

  <div id="multiverse" class="panel">
    <details>
      <summary>🌐 マルチバース (Phase E)</summary>
      <div class="row">
        <input type="text" id="own-peer-id" readonly placeholder="接続中…">
        <button id="copy-peer-id" type="button" title="自分の ID をコピー">📋</button>
      </div>
      <div class="row">
        <input type="text" id="peer-id" placeholder="相手の Peer ID">
        <button id="connect-peer" type="button">接続</button>
      </div>
      <div id="peers-list"></div>
    </details>
  </div>

  <div id="help" class="panel">
    マウス: <kbd>ドラッグ</kbd> 回転 / <kbd>ホイール</kbd> ズーム
  </div>

  <!--
    MediaPipe の npm 版は UMD-only で ESM import を提供しないため、CDN script で
    window.FaceMesh / window.Camera をロードする。型定義は node_modules 経由で参照。
  -->
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
